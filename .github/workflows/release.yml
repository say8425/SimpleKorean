name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: PyPI에 다시 올릴 릴리스 태그(예 v1.2.0). 넣으면 release-please를 건너뛰고 이 태그만 올린다.
        required: false
permissions: {}
jobs:
  release-please:
    if: github.event_name != 'workflow_dispatch' || inputs.tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  # 빌드와 업로드를 나눈다. 빌드 중에 도는 코드는 PyPI에 올리는 권한(id-token)을 받지 않는다.
  # main에서 실행한 워크플로만 올린다.
  build:
    needs: release-please
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && (
      (needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::태그는 vX.Y.Z 꼴이어야 합니다: $TAG"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      # main에 들어간 커밋이고 GitHub 릴리스가 있는 태그만 올린다.
      - run: |
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::$TAG의 커밋이 main에 없습니다"; exit 1; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null || { echo "::error::$TAG의 GitHub 릴리스가 없습니다"; exit 1; }
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: python3 -m pip install --require-hashes -r .github/build-requirements.txt
      - run: python3 -m build --no-isolation
      - run: |
          ls dist
          test -f "dist/simple_korean-${TAG#v}.tar.gz" && test -f "dist/simple_korean-${TAG#v}-py3-none-any.whl" \
            || { echo "::error::패키지 버전이 태그 $TAG와 다릅니다"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    # PyPI의 trusted publisher에 이 워크플로(release.yml)와 환경 이름(pypi)을 등록해야 한다.
    environment:
      name: pypi
      url: https://pypi.org/p/simple-korean
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # v1.14.3은 GHSA-5xjx-3w67-w9x9(서명에 쓰는 인증서 체인의 폐기된 CA)를 고친 판이다.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
