name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: python3 -m pip install kiwipiepy==0.24.0 kiwipiepy-model==0.24.0
      - run: python3 evals/ko_lint.py --self-test
      - run: python3 evals/tests/run.py
      - run: node --test src/hooks/simple-korean-activate.test.js
      - run: python3 src/hooks/test_lint_hook.py
      # 릴리스와 같은 길로 빌드한다. sdist를 만들고 그 sdist에서 휠을 만든 뒤 휠을 설치한다.
      - run: python3 -m pip install --require-hashes -r .github/build-requirements.txt
      - run: python3 -m build --no-isolation --outdir "$RUNNER_TEMP/dist"
      - run: python3 -m pip install "$RUNNER_TEMP"/dist/*.whl
      - run: python3 -I -c "import simple_korean as s; assert s.prompt_block('format', 'en').startswith('<!-- simple-korean format-rules en ' + s.__version__); assert s.ko_terms.TERMS_JSON.is_file() and s.ko_rules.SLOP_TSV.is_file(); assert s.lint_detail('배포를 진행합니다.', config={})[0]['category'] == 'light_verb'"
        working-directory: ${{ runner.temp }}
      - run: python3 evals/check_numbers.py
      - run: python3 evals/ko_lint.py --gate=warning skills/simple-korean/SKILL.md skills/simple-korean/references/*.md prompts/system-prompt.md prompts/sentence-rules.ko.md prompts/format-rules.ko.md output-styles/simple-korean.md README.md AGENTS.md CHANGELOG.md tools/slop-lexicon/README.md src/hooks/README.md data/basic-vocabulary/README.md docs/research/*.md evals/pressure-tests.md
  python39:
    # setup-python에 Ubuntu 26.04용 Python 3.9 빌드가 없다.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.9" }
      - run: python3 evals/ko_lint.py --self-test
      - run: python3 evals/tests/run.py
      - run: python3 src/hooks/test_lint_hook.py
      - run: python3 -m pip install .
      - run: python3 -I -c "import simple_korean as s; assert s.prompt_block('sentences', 'ko').startswith('<!-- simple-korean'); assert s.ko_terms.TERMS_JSON.is_file() and s.ko_rules.SLOP_TSV.is_file(); assert s.lint_detail('배포를 진행합니다.', config={})[0]['category'] == 'light_verb'"
        working-directory: ${{ runner.temp }}
