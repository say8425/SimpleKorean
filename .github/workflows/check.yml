name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: python3 -m pip install kiwipiepy==0.24.0 kiwipiepy-model==0.24.0
      - run: python3 evals/ko_lint.py --self-test
      - run: python3 evals/tests/run.py
      - run: node --test src/hooks/simple-korean-activate.test.js
      - run: python3 src/hooks/test_lint_hook.py
      - run: python3 evals/check_numbers.py
      - run: python3 evals/ko_lint.py --gate=warning skills/simple-korean/SKILL.md skills/simple-korean/references/*.md prompts/system-prompt.md output-styles/simple-korean.md README.md CHANGELOG.md tools/slop-lexicon/README.md src/hooks/README.md data/basic-vocabulary/README.md
  python39:
    # setup-python에 Ubuntu 26.04용 Python 3.9 빌드가 없다.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.9" }
      - run: python3 evals/ko_lint.py --self-test
      - run: python3 evals/tests/run.py
      - run: python3 src/hooks/test_lint_hook.py
