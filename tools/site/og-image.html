<!doctype html>
<!--
site/og-image.png(1200x630), site/favicon-32.png, site/apple-touch-icon.png의 원본이다.
레포지토리 최상위에서 tools/site/render.sh를 실행해 다시 만든다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
html, body { margin: 0; }
body { width: 1200px; height: 630px; background: #FBFAF6; color: #1B1B1A; font-family: 'Pretendard Variable', Pretendard, sans-serif; letter-spacing: -0.02em; }
main { box-sizing: border-box; height: 100%; padding: 80px 88px; display: flex; flex-direction: column; justify-content: space-between; }
.grid { display: grid; grid-template-columns: repeat(10, 92px); border-top: 2px solid rgba(181, 56, 31, 0.45); border-left: 2px solid rgba(181, 56, 31, 0.45); width: max-content; }
.grid span { width: 92px; height: 92px; display: grid; place-items: center; border-right: 2px solid rgba(181, 56, 31, 0.45); border-bottom: 2px solid rgba(181, 56, 31, 0.45); font-weight: 800; font-size: 60px; line-height: 1; box-sizing: border-box; }
.grid .dot { color: #B5381F; }
h1 { margin: 0; font-size: 56px; font-weight: 700; line-height: 1.3; }
p { margin: 16px 0 0; font-size: 28px; color: #5E5B55; }
</style>
</head>
<body>
<main>
<div class="grid"><span>쉬</span><span>운</span><span></span><span>한</span><span>국</span><span>어</span><span class="dot">.</span><span></span><span></span><span></span></div>
<div>
<h1>AI가 쓰는 한국어를 짧고 분명하게.</h1>
<p>SimpleKorean, 쉬운 한국어를 쓰는 에이전트 스킬</p>
</div>
</main>
</body>
</html>
