[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "simple-korean"
version = "1.2.0" # x-release-please-version
description = "SimpleKorean 규칙 판본과 린터를 Python에서 쓴다"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.urls]
Homepage = "https://github.com/say8425/SimpleKorean"

[tool.hatch.build.targets.wheel]
packages = ["src/simple_korean"]

# sdist에는 휠을 만드는 데 드는 파일만 넣는다. evals/와 docs/의 측정 자료는 넣지 않는다.
[tool.hatch.build.targets.sdist]
include = [
  "/src/simple_korean",
  "/prompts/sentence-rules.*.md",
  "/prompts/format-rules.*.md",
  "/data/terms.json",
  "/evals/slop.tsv",
  "/README.md",
  "/LICENSE",
  "/NOTICE",
]

# 판본은 prompts/에, 단어 목록과 슬롭 어휘는 data/와 evals/에 둔다. 태그마다 같은 경로로 읽게 하려고
# 옮기지 않고 패키지에 복사한다.
[tool.hatch.build.targets.wheel.force-include]
"prompts/sentence-rules.ko.md" = "simple_korean/prompts/sentence-rules.ko.md"
"prompts/sentence-rules.en.md" = "simple_korean/prompts/sentence-rules.en.md"
"prompts/format-rules.ko.md" = "simple_korean/prompts/format-rules.ko.md"
"prompts/format-rules.en.md" = "simple_korean/prompts/format-rules.en.md"
"data/terms.json" = "simple_korean/data/terms.json"
"evals/slop.tsv" = "simple_korean/data/slop.tsv"
