[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "simple-korean"
version = "1.1.1" # x-release-please-version
description = "SimpleKorean 규칙 판본을 Python에서 읽는다"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.urls]
Homepage = "https://github.com/say8425/SimpleKorean"

[tool.hatch.build.targets.wheel]
packages = ["src/simple_korean"]

# 판본 원본은 prompts/에 둔다. 태그마다 같은 경로로 읽게 하려고 옮기지 않고 패키지에 복사한다.
[tool.hatch.build.targets.wheel.force-include]
"prompts/sentence-rules.ko.md" = "simple_korean/prompts/sentence-rules.ko.md"
"prompts/sentence-rules.en.md" = "simple_korean/prompts/sentence-rules.en.md"
"prompts/format-rules.ko.md" = "simple_korean/prompts/format-rules.ko.md"
"prompts/format-rules.en.md" = "simple_korean/prompts/format-rules.en.md"
